name: PowerTools Windows Release

on:
  push:
    branches:
      - feature/powertools
      - feature/powertools-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        shell: pwsh
        run: npm install --global pnpm@10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable updater artifacts for unsigned community build
        shell: pwsh
        run: |
          $path = 'packages/player/src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 100 | Set-Content $path

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/player
          tagName: powertools-${{ github.run_number }}
          releaseName: Nuclear PowerTools v0.2.0 build ${{ github.run_number }}
          releaseBody: |
            Windows x64 build of Nuclear with PowerTools integration.

            Includes My Wave, favorite shuffle, automatic lyrics with lyrics.ovh and Genius fallback, native tray controls and player-bar controls.
          releaseDraft: false
          prerelease: true
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: --ci
